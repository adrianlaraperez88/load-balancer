<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISG Load Balancer & Gateway API Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin:0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-banner h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-banner .badge {
      font-size: 0.75rem;
      background: #0284c7;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .swagger-ui .topbar {
      display: none !important;
    }
    /* Dark mode subtle accents for Swagger UI */
    .swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      filter: invert(88%) hue-rotate(180deg);
    }
    .swagger-ui .model-box, .swagger-ui img {
      filter: invert(100%) hue-rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="topbar-banner">
    <h1>
      <span>ISG Load Balancer & Gateway</span>
      <span class="badge">Laravel 12/13 & PHP 8.3</span>
    </h1>
    <div style="font-size: 0.85rem; color: #94a3b8;">
      Cluster Gateway &bull; HMAC-SHA256 &bull; Sanctum
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/docs/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
