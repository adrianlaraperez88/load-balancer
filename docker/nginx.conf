server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Client body limit matching LOAD_BALANCER_MAX_BODY_BYTES
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts & High-Concurrency Keep-Alive
    client_header_timeout 15;
    client_body_timeout 15;
    keepalive_timeout 65;
    keepalive_requests 10000;
    send_timeout 30;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # Route all requests to Laravel public/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hide dotfiles, git, env files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Pass to PHP-FPM socket with tuned buffers
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 60;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 30;

        # Pass authoritative client IP to PHP
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }
}
